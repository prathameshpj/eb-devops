# Debug lab — values.
#
# Lab rules (also in the assignment):
#   * You may change anything in this chart — values or templates.
#   * You may NOT change image.repository or image.tag.
#   * You may NOT modify anything under ../cluster-state/.
#   * You may NOT delete workloads to make a symptom disappear.

image:
  repository: docker.io/ebinterview/eb-debug-app
  tag: "1.0.1"
  pullPolicy: IfNotPresent

# The image declares USER "nonroot" (a name, not a UID). With runAsNonRoot the
# kubelet cannot prove a *name* is non-root and refuses to start the container
# (CreateContainerConfigError). The image's /etc/passwd maps nonroot -> 65532.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

common:
  # Every workload serves plain HTTP on this port. It is passed to the app as
  # PORT: the image's built-in default is 8081, not 8080.
  port: 8080

backend:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "backend"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

gateway:
  replicas: 1
  env:
    APP_MODE: "gateway"
    APP_NAME: "gateway"
    VERSION: "2.0.0"
    # Was http://backend.default.svc:8080 -> the "default" namespace has no
    # backend Service (NXDOMAIN), and the gateway's readiness depends on the
    # backend, so it stayed 503. The short name resolves in the release's own
    # namespace via the pod's DNS search path, wherever the chart is installed.
    BACKEND_URL: "http://backend:8080"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

worker:
  replicas: 1
  env:
    APP_MODE: "worker"
    APP_NAME: "worker"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

reporter:
  replicas: 1
  serviceAccountName: reporter
  env:
    APP_MODE: "reporter"
    APP_NAME: "reporter"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

metrics:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "metrics"
    VERSION: "2.0.0"
  resources:
    # Was requests 2 / limits 4 CPU: the namespace LimitRange caps a container
    # at 1 CPU, so the ReplicaSet could not create a single pod (FailedCreate).
    # Same app binary as backend (APP_MODE=api) -> same sizing as its siblings.
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

migrate:
  enabled: true
  backoffLimit: 2
