apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.common.port }}
          env:
            # The image defaults to :8081 (see its startup log); probes,
            # containerPort and the Service targetPort all use common.port.
            - name: PORT
              value: {{ .Values.common.port | quote }}
            {{- range $name, $value := .Values.worker.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.common.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem stays on; the worker gets a scratch volume
          # for the one path it must write (it exits FATAL otherwise).
          volumeMounts:
            - name: cache
              mountPath: /var/cache/app
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
